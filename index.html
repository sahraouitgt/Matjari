<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17233B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>متجري</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Cairo:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F7;--sf:#fff;--ink:#17233B;--mut:#667089;--ln:#E2E5EC;--ac:#0F766E;--acs:#DCF1EE;--wr:#B45309;--rd:#B91C1C;--hd:#17233B;--hdt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--sf:#182039;--ink:#EEF1F7;--mut:#9AA3B8;--ln:#2A3354;--ac:#2DD4BF;--acs:#12322F;--wr:#F59E0B;--rd:#F87171;--hd:#0A0F1C}}
:root[data-theme="dark"]{--bg:#0E1424;--sf:#182039;--ink:#EEF1F7;--mut:#9AA3B8;--ln:#2A3354;--ac:#2DD4BF;--acs:#12322F;--wr:#F59E0B;--rd:#F87171;--hd:#0A0F1C}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;font-size:16px;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--hd);color:var(--hdt);padding:14px 18px;font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#gear{background:none;border:0;font-size:22px;color:inherit;cursor:pointer;padding:0 2px}
.wrap{flex:1;position:relative;min-height:0}
main{position:absolute;inset:0;overflow-y:auto;padding:14px 14px 90px}
nav{display:none!important}
nav button{min-width:0;border:0;background:none;color:var(--mut);font:inherit;font-size:10px;padding:8px 0 7px;white-space:nowrap;text-align:center;justify-content:center;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:21px;line-height:1.1}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
.row{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-bottom:9px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.row b{font-weight:700}
.sub{color:var(--mut);font-size:13.5px;margin-top:2px}
.tag{background:var(--acs);color:var(--ac);border-radius:20px;padding:3px 11px;font-weight:700;font-size:14px;white-space:nowrap}
.tag.low{background:#FDE9D4;color:var(--wr)}
.x{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;cursor:pointer;padding:6px 0 6px 4px}
.x.sure{color:var(--rd);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:50px 20px;line-height:1.9}
#fab{position:absolute;left:16px;bottom:16px;width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}
.card small{color:var(--mut);display:block;font-size:13px}
.card strong{font-size:22px}
.card.big{grid-column:1/-1;background:var(--hd);color:var(--hdt);border:0}
.card.big small{color:#B9C1D6}
.card.big strong{font-size:30px}
h3{font-size:16px;margin:16px 2px 9px}
.bars{display:flex;align-items:flex-end;gap:7px;height:130px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 12px 8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut);gap:4px}
.bars i{display:block;width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
#ov.on{display:flex}
#sh{background:var(--sf);width:100%;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto}
#sh h2{font-size:18px;margin-bottom:12px}
label{display:block;font-size:13.5px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;font:inherit;font-weight:700;padding:12px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);cursor:pointer}
.btns button.p{background:var(--ac);border-color:var(--ac);color:#fff}
#err{color:var(--rd);font-size:14px;margin-top:10px;min-height:1em}
:root[data-c="1"],:root[data-c="2"]{--ink:#000;--mut:#2B3348;--ln:#A9B1C2}
@media(prefers-color-scheme:dark){:root[data-c="1"],:root[data-c="2"]{--ink:#fff;--mut:#D3D9E8;--ln:#56608A}}
body{font-weight:var(--fw,400)}
#zz,#zs{zoom:var(--z,1)}
input[type=range]{padding:6px 0;accent-color:var(--ac)}
.iv h4{margin:10px 10px 4px;font-size:14px}
.iv table.c td{text-align:center!important}
.iv tr[data-inv]{cursor:pointer}
.iv{background:linear-gradient(#fff,#EEF4FF);color:#0B2A66;border-radius:12px;overflow:hidden;border:1px solid #C9D6EE;font-size:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.iv .hd{background:#0B2A66;color:#fff;text-align:center;padding:14px 10px;border-bottom:4px solid #D4A72C}
.iv .hd{position:relative}.iv .hd.hs{padding-inline:96px}
.iv .stk{position:absolute;top:8px;left:8px;max-width:86px;padding:5px 8px;font-size:11px;line-height:1.25;font-weight:700;color:#0B2A66;background:linear-gradient(135deg,#FBE08A,#D4A72C);border:1px solid #fff8;border-radius:10px;transform:rotate(-7deg);box-shadow:0 3px 6px rgba(0,0,0,.35)}
.iv .hd b{display:block;font-size:20px}.iv .hd small{color:#F2C94C;font-size:13px}
.iv .tt1{margin:12px auto;width:max-content;background:#0B2A66;color:#fff;padding:6px 28px;border-radius:18px;font-weight:700;font-size:17px;border:2px solid #D4A72C}
.iv .inf{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:0 10px 10px;padding:10px;background:#EAF1FD;border:1px solid #C9D6EE;border-radius:10px}
.iv .inf div{display:flex;flex-direction:column}.iv .inf span{color:#5A6E96;font-size:12px}
.iv table{width:100%;border-collapse:collapse;table-layout:fixed}
.iv th{background:#0B2A66;color:#fff;padding:8px 1px;font-size:12px;white-space:nowrap}.iv th small{display:block;font-size:10.5px;color:#F2C94C}
.iv td{padding:7px 3px;text-align:center;border-bottom:1px solid #D6E0F2;font-size:13px;word-break:break-word}
.iv tr:nth-child(even) td{background:#F1F6FF}.iv td:nth-child(2){text-align:start}
.iv .tot{margin:10px}
.iv .tot div{display:flex;align-items:stretch;border-radius:8px;overflow:hidden;margin-bottom:6px;border:1px solid #C9D6EE;background:#fff}
.iv .tot span{padding:8px 14px;color:#fff;font-weight:700;flex:0 0 auto;white-space:nowrap;font-size:14px}
.iv .tot b{padding:8px 10px;font-size:16px;flex:1;text-align:center}
.iv .t1 span{background:#0B2A66}.iv .t2 span{background:#15803D}.iv .t3 span{background:#B91C1C}.iv .t3 b{color:#B91C1C}
.iv .ft{text-align:center;padding:10px;border-top:3px solid #D4A72C;background:#0B2A66;color:#fff}
.tb.ed{table-layout:fixed}
.tb.ed th:nth-child(1){width:7%}.tb.ed th:nth-child(3){width:15%}.tb.ed th:nth-child(4){width:19%}.tb.ed th:nth-child(5){width:16%}.tb.ed th:nth-child(6){width:9%}
.tb.ed th{padding:7px 1px;font-size:12.5px;white-space:nowrap}
.tb.ed td{padding:4px 2px}
.tb.ed input,.tb.ed select{padding:7px 3px;font-size:13.5px;width:100%;min-width:0;text-align:center}
.tb.ed select{text-align:start;padding:7px 2px;text-overflow:ellipsis}
.tb.ed .sr input{width:48%;margin-top:2px}
.tb.ed .nm{font-size:12.5px;margin:3px 0 0;font-weight:700;color:var(--ac);text-align:start;white-space:normal;line-height:1.35}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
.tb th,.tb td{border:1px solid var(--ln);padding:7px 5px;text-align:center}
.tb th{background:var(--acs);color:var(--ac)}
.tb td:nth-child(2){text-align:start}
.tb tr.tt td{font-weight:700;background:var(--bg)}
.x.dl,.btns button.dl{color:var(--rd);font-weight:700}
#back{background:none;border:0;color:inherit;font-size:26px;cursor:pointer;padding:0 4px;line-height:1}
main.hm{display:block;padding:14px 14px 28px;overflow-y:auto}
.home{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.tile{display:flex;flex-direction:column;gap:7px;background:none;border:0;padding:0;color:var(--ink);font:inherit;text-align:start;cursor:pointer;min-width:0}
.tile.wide{grid-column:1/-1}
.tile{padding-bottom:9px}
.tile .pic{height:128px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:58px;position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s;
 box-shadow:0 8px 0 var(--sd),0 14px 16px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -14px 22px rgba(0,0,0,.2)}
.tile.wide .pic{height:170px;font-size:76px}
.tile .pic::before{content:"";position:absolute;inset:0 0 52% 0;background:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,0));border-radius:22px 22px 60% 60%/22px 22px 36% 36%}
.tile .pic::after{content:"";position:absolute;width:70%;height:16px;bottom:10px;background:radial-gradient(rgba(0,0,0,.28),transparent 70%)}
.tile .pic span{position:relative;z-index:1;transform:translateY(-4px) rotate(-5deg) scale(1.06);filter:drop-shadow(0 7px 5px rgba(0,0,0,.45))}
.tile:active .pic{transform:translateY(7px);box-shadow:0 1px 0 var(--sd),0 4px 8px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.45),inset 0 -14px 22px rgba(0,0,0,.2)}
.tile.warn small{color:var(--wr);font-weight:700}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{flex:1;font:inherit;padding:8px;border-radius:20px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media print{header,.wrap,nav{display:none!important}body{display:block;overflow:visible;height:auto}#ov{position:static;background:none;display:block}#sh{max-height:none;border-radius:0}#sh .btns,#err{display:none}}
</style>
</head>
<body>
<header><span style="display:flex;align-items:center;gap:10px"><button id="back" aria-label="رجوع" style="display:none">→</button><span id="ttl"></span></span><button id="gear" aria-label="الإعدادات">⚙️</button></header>
<div class="wrap"><main id="main"></main><button id="fab" aria-label="إضافة">+</button></div>
<nav id="nav"></nav>
<div id="ov"><div id="sh"></div></div>
<script>
const K='shop_v1';
let S={items:[],customers:[],suppliers:[],purchases:[],sales:[],pays:[],cfg:{}};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function migrate(){
 S.sales=S.sales.map((x,i)=>x.lines?x:{id:x.id,no:x.no||i+1,date:x.date,pid:x.pid,pname:x.pname,disc:0,paid:x.paid==null?x.qty*x.price:x.paid,lines:[{iid:x.iid,iname:x.iname,qty:x.qty,price:x.price,cost:x.cost}]});
 S.purchases=S.purchases.map((x,i)=>x.lines?x:{id:x.id,no:i+1,date:x.date,pid:x.pid,pname:x.pname,disc:0,paid:x.paid==null?x.qty*x.cost:x.paid,lines:[{iid:x.iid,iname:x.iname,qty:x.qty,cost:x.cost,price:((S.items.find(t=>t.id===x.iid)||{}).price)||0}]});
}
migrate();
let tab='home',pend=null,q='',invK='sales',invF='all',invP='';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=v=>(+v||0).toLocaleString('en-US',{maximumFractionDigits:2});
const fm=v=>f(v)+' '+((S.cfg&&S.cfg.cur)||'دينار');
const sum=(a,g)=>a.reduce((s,x)=>s+g(x),0);
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const empty=m=>`<div class="empty">${m}</div>`;
const del=(k,id)=>`<button class="x dl ${pend===k+id?'sure':''}" data-del="${k}:${id}">${pend===k+id?'⚠ اضغط للتأكيد':'🗑 حذف'}</button>`;
const m=(...s)=>!q||s.join(' ').toLowerCase().includes(q.toLowerCase());
const tabs=[['items','المخزون','📦'],['customers','العملاء','👥'],['purchases','المشتريات','🛒'],['sales','المبيعات','💰'],['invoices','الفواتير','🧾'],['suppliers','الموردون','🚚'],['stats','التحليل','📊']];
const fld=(id,l,t='text',v='')=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" ${t==='number'?'inputmode="decimal" min="0" step="any"':''} value="${esc(v)}">`;
const sel=(id,l,o)=>`<label for="${id}">${l}</label><select id="${id}">${o}</select>`;
const opts=(a,x)=>a.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')+(x||'');
const v=id=>$('#'+id).value.trim(),nv=id=>parseFloat($('#'+id).value)||0;
const FONTS=[['Tajawal','تجوال'],['Cairo','القاهرة'],['Amiri','أميري (نسخ)'],['system-ui','خط الجهاز']];
const PK={sales:'customers',purchases:'suppliers'};
const total=(x,k)=>sum(x.lines,l=>l.qty*(k==='sales'?l.price:l.cost))-(x.disc||0);
const calc=k=>{const inv=S[k].map(x=>{const t=total(x,k),p0=Math.min(t,x.paid||0);return Object.assign({},x,{t:t,p:p0,r:t-p0,pl:p0>0?[{d:x.date,h:x.time||'',a:p0,n:'عند إصدار الفاتورة'}]:[]})});
 S.pays.filter(p=>p.kind===PK[k]).forEach(py=>{let rem=py.amount;const L=inv.filter(x=>x.pid===py.pid&&x.r>0.005),ord=py.no?L.filter(x=>x.no===py.no).concat(L.filter(x=>x.no!==py.no)):L;
  ord.forEach(x=>{if(rem>0.005){const a=Math.min(rem,x.r);rem-=a;x.p+=a;x.r-=a;x.pl.push({d:py.date,h:py.time||'',a:a,n:py.note||'دفعة لاحقة'})}})});
 return inv};
const debt=(k,id)=>Math.max(0,sum(calc(k==='customers'?'sales':'purchases').filter(x=>x.pid===id),x=>x.r));
function open_(t){tab=t;pend=null;q='';history.pushState({t:t},'');$('#ov').classList.remove('on');render()}
function sheet(title,body,ok,lab){
  $('#sh').innerHTML=`<div id="zs"><h2>${title}</h2>${body}<div id="err"></div><div class="btns"><button data-close>إلغاء</button><button class="p" id="ok">${lab||'حفظ'}</button></div></div>`;
  $('#ov').classList.add('on');
  $('#ok').onclick=()=>{const m=ok();if(m)$('#err').textContent=m;else{save();$('#ov').classList.remove('on');render()}};
}
function edit(k,id){const o=S[k].find(x=>x.id===id);if(!o)return;
  if(k==='items')sheet('تعديل المنتج',fld('a','اسم المنتج','text',o.name)+fld('b','الكمية','number',o.qty)+fld('c','سعر الشراء (التكلفة)','number',o.cost)+fld('d','سعر البيع','number',o.price),()=>{if(!v('a'))return'اكتب اسم المنتج.';Object.assign(o,{name:v('a'),qty:nv('b'),cost:nv('c'),price:nv('d')})});
  else sheet(k==='customers'?'تعديل العميل':'تعديل المورد',fld('a','الاسم','text',o.name)+fld('b','رقم الهاتف','tel',o.phone),()=>{if(!v('a'))return'اكتب الاسم.';o.name=v('a');o.phone=v('b')});}
function pay(k,id,no){const o=S[k].find(x=>x.id===id);if(!o)return;const sk=k==='customers'?'sales':'purchases',d=debt(k,id),U=calc(sk).filter(x=>x.pid===id&&x.r>0.005);
 sheet((k==='customers'?'دفعة من ':'دفعة إلى ')+esc(o.name),'<p class="sub">المتبقي: '+fm(d)+'</p>'+fld('a','المبلغ','number',d||'')
  +sel('pn','على أي فاتورة؟','<option value="">الأقدم أولًا (تلقائي)</option>'+U.map(x=>`<option value="${x.no}" ${x.no===no?'selected':''}>فاتورة ${String(x.no).padStart(6,'0')} — متبقي ${fm(x.r)}</option>`).join(''))+fld('nt','ملاحظة (اختياري)','text'),
  ()=>{const a=nv('a');if(a<=0)return'أدخل مبلغًا صحيحًا.';if(a>d+0.005)return'المبلغ أكبر من المتبقي ('+fm(d)+').';
   S.pays.push({id:uid(),date:today(),time:new Date().toTimeString().slice(0,5),kind:k,pid:id,amount:a,no:v('pn')?+v('pn'):0,note:v('nt')});setTimeout(()=>partyDlg(k,id),50)},'تسجيل');
 if(no){const x=U.find(y=>y.no===no);if(x)$('#a').value=x.r}}
function backup(){
  sheet('نسخ احتياطي واستعادة','<p class="sub">انسخ النص واحفظه في مكان آمن (ملاحظات أو واتساب). للاستعادة الصق النص هنا واضغط استعادة، وسيستبدل البيانات الحالية.</p><textarea id="t" rows="7" style="direction:ltr;font-size:12px"></textarea><div class="btns"><button id="cp">نسخ</button><button id="sg">مشاركة</button></div>',()=>{try{const d=JSON.parse($('#t').value);if(!d||!Array.isArray(d.items))return'النص غير صالح.';S=Object.assign({items:[],customers:[],suppliers:[],purchases:[],sales:[],pays:[],cfg:S.cfg},d);migrate()}catch(e){return'النص غير صالح.'}},'استعادة');
  $('#t').value=JSON.stringify(S);
  $('#cp').onclick=async()=>{const t=$('#t');t.select();try{await navigator.clipboard.writeText(t.value);$('#err').textContent='تم النسخ.'}catch(e){try{document.execCommand('copy')}catch(x){}$('#err').textContent='إن لم يُنسخ النص فحدده وانسخه يدويًا.'}};
  $('#sg').onclick=()=>{if(navigator.share)navigator.share({text:$('#t').value}).catch(()=>{});else $('#err').textContent='المشاركة غير متاحة، استخدم النسخ.'};}
function applyCfg(){const c=S.cfg=Object.assign({cur:'دينار',font:'Tajawal',z:1,c:0},S.cfg||{});const r=document.documentElement;
  document.body.style.fontFamily=c.font==='system-ui'?'system-ui,Tahoma,sans-serif':`'${c.font}',system-ui,Tahoma,sans-serif`;
  r.style.setProperty('--z',c.z);r.style.setProperty('--fw',['400','500','700'][c.c]||'400');r.setAttribute('data-c',c.c);}
function settings(){const c=S.cfg;
  const live=()=>{c.font=v('sf');c.z=parseFloat($('#sz').value)||1;c.c=+v('sc');c.cur=v('cu')||'دينار';c.shop=v('sn')||'متجري';c.slogan=v('sl');applyCfg();save();render()};
  sheet('الإعدادات',sel('sf','نوع الخط',FONTS.map(x=>`<option value="${x[0]}" ${c.font===x[0]?'selected':''}>${x[1]}</option>`).join(''))
   +`<label for="sz">حجم الخط</label><input id="sz" type="range" min="0.85" max="1.5" step="0.05" value="${c.z}">`
   +sel('sc','وضوح الخط',[['0','عادي'],['1','واضح'],['2','واضح جدًا (عريض)']].map(x=>`<option value="${x[0]}" ${+c.c===+x[0]?'selected':''}>${x[1]}</option>`).join(''))
   +fld('cu','العملة (مثل: دج)','text',c.cur)+fld('sn','اسم المتجر (يظهر في الفاتورة)','text',c.shop||'متجري')+fld('sl','عبارة المتجر (تظهر كملصق على الفاتورة)','text',c.slogan||'')

 $('#b1').onclick=()=>inv('sales',null,id);$('#b2').onclick=()=>inv('purchases',null,id);$('#b4').onclick=()=>edit('items',id);two($('#b5'),()=>{S.items=S.items.filter(x=>x.id!==id);save();$('#ov').classList.remove('on');render()})}

const party=(k,c)=>{const sk=k==='customers'?'sales':'purchases',t=sum(calc(sk).filter(x=>x.pid===c.id),x=>x.t),d=debt(k,c.id);
 return `<div class="row" data-dt="${k}:${c.id}"><div><b>${esc(c.name)}</b><div class="sub">${esc(c.phone)||'بدون رقم'}${d>0?` · <span style="color:var(--wr);font-weight:700">${k==='customers'?'عليه':'عليك'} ${fm(d)}</span>`:''}</div>${del(k,c.id)}</div><span class="tag">${fm(t)}</span></div>`};
function invList(k,ch){const A=calc(k).reverse();
 const L=A.filter(x=>(invF==='all'||(invF==='paid'?x.r<=0.005:x.r>0.005))&&(!invP||x.pid===invP)&&m(x.pname,x.date,String(x.no),x.lines.map(l=>l.iname).join(' ')));
 const T=sum(A,x=>x.t),RM=sum(A,x=>Math.max(0,x.r)),np=A.filter(x=>x.r>0.005).length;
 const c1=(a,b,c)=>`<button class="chip ${a?'on':''}" data-flt="${b}">${c}</button>`,pn=invP&&(S.customers.concat(S.suppliers).find(x=>x.id===invP)||{}).name;
 return (ch?'<div class="chips">'+c1(k==='sales','ksales','فواتير البيع')+c1(k==='purchases','kpurchases','فواتير الشراء')+'</div>':'')
  +`<div class="grid"><div class="card"><small>عدد الفواتير</small><strong>${A.length}</strong></div><div class="card"><small>غير مسددة</small><strong>${np}</strong></div><div class="card"><small>الإجمالي</small><strong>${fm(T)}</strong></div><div class="card"><small>المتبقي</small><strong style="color:var(--wr)">${fm(RM)}</strong></div></div>`
  +'<div class="chips">'+c1(invF==='all','all','الكل')+c1(invF==='paid','paid','مسددة')+c1(invF==='unpaid','unpaid','غير مسددة')+'</div>'
  +(invP?'<div class="chips">'+c1(1,'clrP',esc(pn||'')+' ✕')+'</div>':'')
  +L.map(x=>`<div class="row" data-inv="${k}:${x.no}"><div><b>فاتورة ${x.no} · ${esc(x.pname)}</b><div class="sub">${x.date} · ${x.lines.length} منتج · ${fm(x.t)}</div><button class="x dl ${pend==='i'+k+x.no?'sure':''}" data-dinv="${k}:${x.no}">${pend==='i'+k+x.no?'⚠ اضغط للتأكيد':'🗑 حذف'}</button></div><span class="tag ${x.r>0.005?'low':''}">${x.r>0.005?'متبقي '+fm(x.r):'مسددة'}</span></div>`).join('')
  +(L.length?'':empty(A.length?'لا نتائج.':'لا توجد فواتير بعد.<br>اضغط + لإنشاء فاتورة.'))}

const views={
items(){if(!S.items.length)return empty('لا توجد منتجات بعد.<br>اضغط + لإضافة منتج، أو سجّل فاتورة شراء.');
 return S.items.filter(i=>m(i.name)).map(i=>`<div class="row" data-dt="items:${i.id}"><div><b>${esc(i.name)}</b><div class="sub">بيع ${fm(i.price)} · تكلفة ${fm(i.cost)}</div>${del('items',i.id)}</div><span class="tag ${i.qty<=3?'low':''}">${f(i.qty)}</span></div>`).join('')},
customers(){if(!S.customers.length)return empty('لا يوجد عملاء بعد.<br>اضغط + أو أضفهم من فاتورة البيع.');return S.customers.filter(c=>m(c.name,c.phone)).map(c=>party('customers',c)).join('')},
suppliers(){if(!S.suppliers.length)return empty('لا يوجد موردون بعد.<br>اضغط + أو أضفهم من فاتورة الشراء.');return S.suppliers.filter(c=>m(c.name,c.phone)).map(c=>party('suppliers',c)).join('')},
sales(){return invList('sales',0)},purchases(){return invList('purchases',0)},invoices(){return invList(invK,1)},
stats(){const SA=calc('sales'),PU=calc('purchases');
 const sl=sum(SA,x=>x.t),bu=sum(PU,x=>x.t),pr=sum(SA,x=>x.t-sum(x.lines,l=>l.qty*l.cost)),sv=sum(S.items,x=>x.qty*x.cost),low=S.items.filter(i=>i.qty<=3).length,cd=sum(SA,x=>Math.max(0,x.r)),sd=sum(PU,x=>Math.max(0,x.r));
 const days=[...Array(7)].map((_,k)=>{const d=new Date(Date.now()-(6-k)*864e5),key=d.toISOString().slice(0,10);return{l:d.toLocaleDateString('ar',{weekday:'short'}),v:sum(SA.filter(s=>s.date===key),s=>s.t)}});
 const mx=Math.max(1,...days.map(d=>d.v)),top={};SA.forEach(x=>x.lines.forEach(l=>top[l.iname]=(top[l.iname]||0)+l.qty));
 const tl=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,3);
 return `<div class="grid"><div class="card big"><small>صافي الربح</small><strong>${fm(pr)}</strong></div>
 <div class="card" data-go="invoices:sales"><small>إجمالي المبيعات</small><strong>${fm(sl)}</strong></div>
 <div class="card" data-go="invoices:purchases"><small>إجمالي المشتريات</small><strong>${fm(bu)}</strong></div>
 <div class="card" data-go="items"><small>قيمة المخزون</small><strong>${fm(sv)}</strong></div>
 <div class="card" data-go="items"><small>منتجات شارفت على النفاد</small><strong>${low}</strong></div>
 <div class="card" data-go="invoices:sales:unpaid"><small>ديون العملاء لك</small><strong>${fm(cd)}</strong></div>
 <div class="card" data-go="invoices:purchases:unpaid"><small>ديون الموردين عليك</small><strong>${fm(sd)}</strong></div></div>
 <h3>مبيعات آخر 7 أيام</h3><div class="bars">${days.map(d=>`<div><i style="height:${Math.round(d.v/mx*80)}%"></i>${d.l}</div>`).join('')}</div>
 <h3>الأكثر مبيعًا</h3>${tl.length?tl.map(t=>`<div class="row"><b>${esc(t[0])}</b><span class="tag">${f(t[1])}</span></div>`).join(''):empty('ستظهر هنا بعد أول فاتورة بيع.')}<h3>البيانات</h3><div class="btns"><button data-backup>نسخ احتياطي واستعادة</button></div>`}
};

function render(){const home=tab==='home';
 $('#ttl').textContent=home?(S.cfg.shop||'متجري'):tabs.find(t=>t[0]===tab)[1];
 $('#back').style.display=home?'none':'';
 $('#main').className=home?'hm':'';
 if(home){$('#main').innerHTML=homeHTML();$('#fab').style.display='none';return}
 $('#main').innerHTML='<div id="zz">'+(tab==='stats'?'':`<input id="q" placeholder="بحث..." value="${esc(q)}" style="margin-bottom:12px">`)+`<div id="lst">${views[tab]()||(q?empty('لا نتائج.'):'')}</div></div>`;
 $('#fab').style.display=tab==='stats'?'none':'';}
function add(){
 if(tab==='sales'||tab==='purchases')return inv(tab);
 if(tab==='invoices')return inv(invK);
 if(tab==='items')sheet('منتج جديد',fld('a','اسم المنتج')+fld('b','الكمية','number')+fld('c','سعر الشراء (التكلفة)','number')+fld('d','سعر البيع','number'),()=>{if(!v('a'))return'اكتب اسم المنتج.';S.items.push({id:uid(),name:v('a'),qty:nv('b'),cost:nv('c'),price:nv('d')})});
 else{const k=tab;sheet(k==='customers'?'عميل جديد':'مورد جديد',fld('a','الاسم')+fld('b','رقم الهاتف','tel'),()=>{if(!v('a'))return'اكتب الاسم.';S[k].push({id:uid(),name:v('a'),phone:v('b')})})}}

document.addEventListener('click',e=>{
 const t=e.target.closest('button');
 if(!t){const w=e.target.closest('[data-inv]'),r=e.target.closest('[data-dt]'),g=e.target.closest('[data-go]');
  if(w){const a=w.dataset.inv.split(':');showInv(a[0],+a[1])}
  else if(r){const a=r.dataset.dt.split(':');a[0]==='items'?itemDlg(a[1]):partyDlg(a[0],a[1])}
  else if(g){const a=g.dataset.go.split(':');invP='';invK=a[1]||'sales';invF=a[2]||'all';open_(a[0])}
  return}
 if(t.dataset.tab){invP='';invF='all';open_(t.dataset.tab)}
 else if(t.id==='back'){if(history.state&&history.state.t)history.back();else{tab='home';render()}}
 else if(t.id==='gear'||t.hasAttribute('data-set'))settings();
 else if(t.id==='fab')add();
 else if(t.hasAttribute('data-close'))$('#ov').classList.remove('on');
 else if(t.dataset.del){const a=t.dataset.del.split(':');if(pend===a[0]+a[1]){S[a[0]]=S[a[0]].filter(x=>x.id!==a[1]);pend=null;save()}else pend=a[0]+a[1];render()}
 else if(t.dataset.dinv){const a=t.dataset.dinv.split(':'),key='i'+a[0]+a[1];if(pend===key){rmInv(a[0],+a[1]);pend=null}else pend=key;render()}
 else if(t.dataset.flt){const z=t.dataset.flt;if(z==='clrP')invP='';else if(z[0]==='k')invK=z.slice(1);else invF=z;render()}
 else if(t.hasAttribute('data-backup'))backup();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#lst').innerHTML=views[tab]()||empty('لا نتائج.')}});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')$('#ov').classList.remove('on')});
history.replaceState(null,'');window.addEventListener('popstate',e=>{$('#ov').classList.remove('on');tab=(e.state&&e.state.t)||'home';pend=null;q='';render()});
applyCfg();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
